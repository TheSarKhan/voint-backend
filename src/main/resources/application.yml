spring:
  application:
    name: voint-backend
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voint}
    username: ${SPRING_DATASOURCE_USERNAME:voint}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

voint:
  jwt:
    # HS256 secret - MUST be at least 32 bytes. Override in every real environment!
    secret: ${JWT_SECRET:voint-dev-secret-change-me-0123456789abcdef}
    access-ttl-minutes: 60
    refresh-ttl-days: 7
  vapi:
    # Shared secret verified against the incoming "x-vapi-secret" header on every request to
    # /api/v1/voice/webhook (see VapiWebhookAuthFilter). Blank/unset = verification disabled
    # (bootstrap default, logs a startup WARN) - set this to Vapi's "Server URL Secret" before
    # exposing the backend publicly.
    webhook-secret: ${VAPI_WEBHOOK_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Optional pins - leave empty to auto-discover a "flash" / "embedding" model via ListModels.
    model: ${GEMINI_MODEL:}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:}
  soniox:
    api-key: ${SONIOX_API_KEY:}
  elevenlabs:
    # Not used to synthesise anything - Vapi holds its own copy of this key and does the calling.
    # It is configured here purely so ProviderHealthService can verify the key is still alive,
    # because nothing else in this backend would ever touch it until a call breaks.
    api-key: ${ELEVENLABS_API_KEY:}
    voice-id: ${ELEVENLABS_VOICE_ID:}
  ai:
    # Folder with prompts + RAG templates (see ai/README.md)
    folder: ${VOINT_AI_FOLDER:./ai}
  billing:
    # What each provider charges us, in USD (their own published units). Update these when a
    # provider changes its price list - nothing else in the code hardcodes a rate.
    usd-to-azn: ${VOINT_USD_TO_AZN:1.70}
    tts-per-1k-chars: ${VOINT_RATE_TTS:0.10}          # ElevenLabs PAYG, multilingual v2/v3
    llm-input-per-1m-tokens: ${VOINT_RATE_LLM_IN:0.30}   # Gemini 2.5 Flash
    llm-output-per-1m-tokens: ${VOINT_RATE_LLM_OUT:2.50}
    vapi-per-minute: ${VOINT_RATE_VAPI:0.05}
    stt-per-minute: ${VOINT_RATE_STT:0.002}           # Soniox real-time, $0.12/hour
    telephony-per-minute: ${VOINT_RATE_TELEPHONY:0.01}
    # Month boundaries are local to the business: "July" must mean July in Baku, not UTC.
    zone: ${VOINT_BILLING_ZONE:Asia/Baku}
  cors:
    # Comma-separated origins allowed to call the API from a browser (voint-panel's dev server
    # on 5173, voint-admin's on 5180, by default). Add deployed panel URLs here once they exist.
    allowed-origins: ${VOINT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5180}

logging:
  level:
    com.starsoft.voint: DEBUG

---
# ---- local profile: run against voint-infra services on localhost ----
spring:
  config:
    activate:
      on-profile: local

---
# ---- docker profile: run inside docker-compose network (voint-infra) ----
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/voint}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
